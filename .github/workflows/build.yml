name: build

# #28: devcontainer と同一イメージ（同一 Dockerfile）で `make build` を CI で回す。
# デプロイは #29 で扱うためここには含めない。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 125 問公開時のフルビルドは実測 35 分（HTML 変換 23 分 + PDF・サイト 12 分）。
    # 60 分では余裕が 25 分しかなく、PR #233 では main 側の実行が 60 分に達して
    # 打ち切られ deploy が skip された（#234 で revert）。GitHub Actions の
    # キャッシュはブランチをまたいで共有されないため main の初回はよりコールドになる。
    # #230 のハッシュキャッシュが効けば通常の PR は数分に戻るので、90 分は
    # 全問再変換が必要なとき（diary.sty 変更・初回公開）の保険。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- devcontainer イメージの取得 ---
      # #50: 従来は毎回 .devcontainer/Dockerfile を docker build していたが、
      # texlive-full を含むこのイメージはビルド(+ GHA レイヤキャッシュ復元)自体が
      # CI 時間の大半(ウォームでも約 23 分)を占めていた。
      # イメージのビルドは .devcontainer/** 変更時のみ動く image.yml に分離し、
      # ここでは GHCR に事前ビルド済みの latest イメージを pull するだけにする。
      # これにより「1 問の content 変更」では docker build が一切走らなくなる。
      #
      # GHCR パッケージは private のままで良い: 同一リポジトリの GITHUB_TOKEN には
      # 既定で packages:read 相当の権限があり(上の permissions: packages: read で
      # 明示)、追加シークレットなしで docker/login-action → docker pull できる。
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image from GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/diary-devcontainer:latest

      - name: Tag pulled image for local use
        run: docker tag ghcr.io/${{ github.repository_owner }}/diary-devcontainer:latest diary-devcontainer:ci

      # --- .cache/(PDF・SVG のハッシュキャッシュ)と dist/ の永続化 ---
      # キー: OS + Dockerfile のハッシュ(イメージ内ツールのバージョンが変われば
      #       キャッシュを作り直したいため) + content/・styles/diary.sty・scripts/
      #       の内容ハッシュ(ソースが変われば新キーになり、変更分だけ再ビルドされる)。
      # restore-keys: 完全一致キーが無くても「同一 Dockerfile 上での直近のキャッシュ」を
      #       復元できるようにし、build-pdf.js / tikz-svg.js / build-html.js 側の
      #       ハッシュ差分検出（ソース単位）で再利用できる分は再利用する。
      - name: Cache .cache/ and dist/
        uses: actions/cache@v4
        with:
          path: |
            .cache
            dist
          key: >-
            build-cache-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile') }}-${{
            hashFiles('content/**', 'styles/diary.sty', 'scripts/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile') }}-
            build-cache-${{ runner.os }}-

      # --- site/ の npm キャッシュ(package-lock.json 単位) ---
      # make build 内で `cd site && npm ci` が走るため、依存解決を高速化する。
      - name: Cache site npm dependencies
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: site-npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            site-npm-${{ runner.os }}-

      # --- lint/ の npm キャッシュ(package-lock.json 単位) ---
      # make lint 内で lint/node_modules が無い場合のみ `npm ci --prefix lint` が走る。
      - name: Cache lint npm dependencies
        uses: actions/cache@v4
        with:
          path: lint/node_modules
          key: lint-npm-${{ runner.os }}-${{ hashFiles('lint/package-lock.json') }}
          restore-keys: |
            lint-npm-${{ runner.os }}-

      # --- devcontainer と同一イメージ上で make build を実行 ---
      # コンテナ内で root ユーザー(devcontainer.json の remoteUser: root に合わせる)として
      # リポジトリ全体を /workspace にマウントし、make build を実行する。
      - name: make build (in devcontainer image)
        run: |
          START=$(date +%s)
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            diary-devcontainer:ci \
            make build
          END=$(date +%s)
          echo "BUILD_SECONDS=$((END - START))" >> "$GITHUB_ENV"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## build ジョブサマリ"
            echo ""
            echo "- \`make build\` 所要時間: ${BUILD_SECONDS:-N/A} 秒"
            echo "- .cache/dist キャッシュキー: \`build-cache-${{ runner.os }}-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('content/**', 'styles/diary.sty', 'scripts/**') }}\`"
            echo "- 実行時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- ビルド成果物のアップロード（deploy ジョブへ引き継ぐ） ---
      # docker run はコンテナ内で /workspace に書き込むため、ホスト側の
      # site/dist にも同じ内容が反映されている（bind mount のため）。
      - name: Upload site/dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  # #29: Cloudflare Pages への自動デプロイ。
  # - build.yml に同居させる理由: デプロイ対象の成果物（site/dist）は
  #   build ジョブでしか作られず、ジョブを分けても結局 build の完了を
  #   待つ必要がある。ワークフローファイルを分割しても得られる独立性が薄く、
  #   「push 時のみ build の後続として deploy が動く」という依存関係を
  #   `needs:` で素直に表現できるため、deploy.yml には分離せず同一ファイルの
  #   別ジョブとした。
  # - main への push 時のみ実行（PR ではビルドのみでデプロイしない）。
  #   `on:` は build ジョブと共有だが、このジョブの if 条件で
  #   「push かつ main ブランチ」以外を弾く。
  # - wrangler-action を採用: cloudflare/pages-action は Cloudflare 公式の
  #   アナウンスでも Wrangler ベースの `wrangler pages deploy` への移行が
  #   案内されており、機能追加は wrangler-action 側に寄っている。
  #   `wrangler pages deploy` は Direct Upload 方式（Pages プロジェクトの
  #   Git 連携を使わない）で、GitHub Actions 側だけで完結し、
  #   Cloudflare 側のリポジトリ接続設定が不要な点も docs/deploy.md の
  #   手順を単純化できるため選んだ。
  # - シークレット未登録でも PR の CI が壊れない設計:
  #   deploy ジョブ自体が push(main) 時にしか実行されないため、PR では
  #   このジョブそのものがスキップされる。main push 時にシークレットが
  #   未登録の場合はこのジョブが失敗するが、build ジョブ（PR で見えるもの）
  #   には影響しない。
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site/dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      # プロジェクト名を変えたい場合はここを編集する（既定: diary）。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=diary --branch=main
