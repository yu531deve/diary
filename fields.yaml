# 分野辞書（大分野 > 中分野）。ここにない値は linter が弾く。
# 変更は保護ファイル扱い: 単独 issue で行うこと。
# 大学院入試（理工系: 工学・情報・物理系）向けの分野体系
# （2026-08-08 issue #92 で高校数学の単元から刷新）。
# 純粋数学系（集合と位相・代数学・測度論・関数解析・幾何学）は今回は含めない。
# 将来問題が増えたら追加する方針。
- slug: calculus
  name: 微分積分学
  minors:
    - 一変数の微分積分
    - 多変数の微分積分
    - 重積分
    - 級数・一様収束
    - 広義積分
- slug: linear-algebra
  name: 線形代数
  minors:
    - 行列と連立一次方程式
    - 行列式
    - ベクトル空間・線型写像
    - 固有値と対角化
    - 内積空間・二次形式
    - ジョルダン標準形
- slug: complex-analysis
  name: 複素解析
  minors:
    - 正則関数・コーシーの定理
    - ローラン展開・留数
    - 等角写像
- slug: ode
  name: 常微分方程式
  minors:
    - 一階微分方程式
    - 定数係数線形方程式
    - 連立系・解の構造
    - 級数解法
- slug: pde-transforms
  name: 偏微分方程式・積分変換
  minors:
    - フーリエ級数・フーリエ変換
    - ラプラス変換
    - 熱・波動・ラプラス方程式
- slug: vector-analysis
  name: ベクトル解析
  minors:
    - 勾配・発散・回転
    - 線積分・面積分
    - 積分定理
- slug: probability-statistics
  name: 確率・統計
  minors:
    - 確率と確率変数
    - 代表的な分布
    - 極限定理
    - 推定・検定
- slug: numerical-discrete
  name: 数値解析・離散数学
  minors:
    - 数値計算
    - 最適化
    - グラフ・組合せ
